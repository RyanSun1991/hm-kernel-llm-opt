services:
  hmopt:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${HMOPT_BASE_IMAGE:-YOUR_REGISTRY/hmci-docker-image:v3-4.2}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
        NEO4J_REPO_URL: ${NEO4J_REPO_URL:-https://debian.neo4j.com}
        NEO4J_VERIFY_PEER: ${NEO4J_VERIFY_PEER:-false}
        NEO4J_INSTALL_MODE: ${NEO4J_INSTALL_MODE:-offline}
    image: ${HMOPT_IMAGE:-hmopt:local}
    container_name: hmopt-app
    restart: unless-stopped
    # /dev/shm size — Docker's 64MB default is too small for scip-clang's
    # IPC (driver↔worker shared-memory ring buffers). 2GB covers the
    # default ~20 workers with headroom. Override via HMOPT_SHM_SIZE.
    shm_size: ${HMOPT_SHM_SIZE:-2gb}
    environment:
      HMOPT_LLM_BASE_URL: ${HMOPT_LLM_BASE_URL:-http://host.docker.internal:20010/v1}
      HMOPT_LLM_API_KEY: ${HMOPT_LLM_API_KEY:-}
      HMOPT_MCP_SERVER_API_KEY: ${HMOPT_MCP_SERVER_API_KEY:-}
      HMOPT_MCP_ALLOWED_HOSTS: ${HMOPT_MCP_ALLOWED_HOSTS:-}
      HMOPT_MCP_DISABLE_HOST_CHECK: ${HMOPT_MCP_DISABLE_HOST_CHECK:-}
      HMOPT_MCP_HOST: 0.0.0.0
      HMOPT_MCP_PORT: 7331
      HMOPT_SEQ_MCP_HOST: 0.0.0.0
      HMOPT_SEQ_MCP_PORT: 7333
      HMOPT_AUTO_TEST_MCP_HOST: 0.0.0.0
      HMOPT_AUTO_TEST_MCP_PORT: 7336
      HMOPT_START_NEO4J: ${HMOPT_START_NEO4J:-1}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      HMOPT_PATH_ALIAS: ${HMOPT_PATH_ALIAS:-}
    ports:
      - "7475:7474"
      - "7688:7687"
      - "7332:7331"
      - "7333:7333"
      - "7336:7336"
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app
      - ${KERNEL_REPO_PATH:-./data/sample-kernel}:/workspace/kernel:rw
      - ${KERNEL_REPO_PATH}:${KERNEL_REPO_PATH}:rw
      - ${KERNEL_WORKSPACE_PATH:-${KERNEL_REPO_PATH}}:${KERNEL_WORKSPACE_PATH:-${KERNEL_REPO_PATH}}:rw
      - ./data/neo4j/data:/var/lib/neo4j
      - ./data/neo4j/logs:/var/log/neo4j
      - ./data/neo4j/plugins:/var/lib/neo4j/plugins
    working_dir: /app
    command: ["bash", "-lc", "tail -f /dev/null"]

  hmopt-git-mcp:
    image: ${HMOPT_IMAGE:-hmopt:local}
    container_name: hmopt-git-mcp
    restart: unless-stopped
    environment:
      HMOPT_GIT_MCP_HOST: 0.0.0.0
      HMOPT_GIT_MCP_PORT: 7334
      HMOPT_GIT_MCP_MOUNT_PATH: ${HMOPT_GIT_MCP_MOUNT_PATH:-/mcp}
      HMOPT_GIT_MCP_REPOSITORY: ${HMOPT_GIT_MCP_REPOSITORY:-/workspace/kernel}
    ports:
      - "7334:7334"
    volumes:
      - ./:/app
      - ${KERNEL_REPO_PATH:-./data/sample-kernel}:/workspace/kernel:rw
      - ${KERNEL_REPO_PATH}:${KERNEL_REPO_PATH}:rw
      - ${KERNEL_WORKSPACE_PATH:-${KERNEL_REPO_PATH}}:${KERNEL_WORKSPACE_PATH:-${KERNEL_REPO_PATH}}:rw
    working_dir: /app
    command: ["bash", "-lc", "bash scripts/run_git_mcp_server.sh"]

  hmopt-build-mcp:
    image: ${HMOPT_IMAGE:-hmopt:local}
    container_name: hmopt-build-mcp
    restart: unless-stopped
    environment:
      HMOPT_BUILD_MCP_HOST: 0.0.0.0
      HMOPT_BUILD_MCP_PORT: 7335
      HMOPT_BUILD_MCP_MOUNT_PATH: ${HMOPT_BUILD_MCP_MOUNT_PATH:-/mcp}
      HMOPT_BUILD_MCP_MODE: ${HMOPT_BUILD_MCP_MODE:-exec}
      HMOPT_BUILD_MCP_RUNNER_CONTAINER: ${HMOPT_BUILD_MCP_RUNNER_CONTAINER:-}
      HMOPT_BUILD_MCP_RUNNER_IMAGE: ${HMOPT_BUILD_MCP_RUNNER_IMAGE:-}
      HMOPT_BUILD_MCP_PROJECT_PATH: ${HMOPT_BUILD_MCP_PROJECT_PATH:-}
      HMOPT_BUILD_MCP_PROJECT_MOUNT: ${HMOPT_BUILD_MCP_PROJECT_MOUNT:-}
      HMOPT_BUILD_MCP_SIGN_WORKSPACE: ${HMOPT_BUILD_MCP_SIGN_WORKSPACE:-}
    ports:
      - "7335:7335"
    volumes:
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - ${KERNEL_REPO_PATH:-./data/sample-kernel}:/workspace/kernel:rw
      - ${KERNEL_REPO_PATH}:${KERNEL_REPO_PATH}:rw
      - ${KERNEL_WORKSPACE_PATH:-${KERNEL_REPO_PATH}}:${KERNEL_WORKSPACE_PATH:-${KERNEL_REPO_PATH}}:rw
    working_dir: /app
    command: ["bash", "-lc", "bash scripts/run_build_mcp_server.sh"]

  hmopt-skillhub-mcp:
    image: ${HMOPT_IMAGE:-hmopt:local}
    container_name: hmopt-skillhub-mcp
    restart: unless-stopped
    environment:
      HMOPT_SKILLHUB_MCP_HOST: 0.0.0.0
      HMOPT_SKILLHUB_MCP_PORT: 7338
      HMOPT_SKILLHUB_MCP_MOUNT_PATH: ${HMOPT_SKILLHUB_MCP_MOUNT_PATH:-/mcp}
      # The member's .opencode/ inside the mounted kernel repo (read for resolve's
      # --local-memory, written for retrieval.jsonl + the sediment bundle). Defaults
      # to the canonical /workspace/kernel mount so it works without KERNEL_REPO_PATH.
      HMOPT_SKILLHUB_OPENCODE_DIR: ${HMOPT_SKILLHUB_OPENCODE_DIR:-/workspace/kernel/.opencode}
      # Optional explicit hub root; otherwise auto-discovered (kernel .opencode/hub
      # or hm-skill-hub, falling back to the platform's /app/hm-skill-hub).
      HMOPT_SKILLHUB_HUB_ROOT: ${HMOPT_SKILLHUB_HUB_ROOT:-}
    ports:
      - "7338:7338"
    volumes:
      - ./:/app
      - ${KERNEL_REPO_PATH:-./data/sample-kernel}:/workspace/kernel:rw
      - ${KERNEL_REPO_PATH}:${KERNEL_REPO_PATH}:rw
      - ${KERNEL_WORKSPACE_PATH:-${KERNEL_REPO_PATH}}:${KERNEL_WORKSPACE_PATH:-${KERNEL_REPO_PATH}}:rw
    working_dir: /app
    command: ["bash", "-lc", "bash scripts/run_skillhub_mcp_server.sh"]
