# Git MCP 服务器配置
name: git-mcp-server
version: 1.0.0  # 应与src/version.py保持一致
description: 用于Git代码库交互和自动化的模型MCP服务器

# 提供的工具
tools:
  - name: git_status
    description: 显示工作树状态
    inputSchema:
      type: object
      properties: 
        repo_path: 
          type: string
          description: Path to Git repository
      required: ["repo_path"]
  
  - name: git_diff_unstaged 
    description: 显示尚未暂存的工作目录中的更改
    inputSchema:
      type: object
      properties: 
        repo_path: 
          type: string
          description: Path to Git repository
      required: ["repo_path"]
  
  - name: git_diff_staged
    description: 显示已准备提交的更改
    inputSchema:
      type: object
      properties: 
        repo_path: 
          type: string
          description: Path to Git repository
      required: ["repo_path"]
  
  - name: git_diff
    description: 显示分支或提交之间的差异
    inputSchema:
      type: object
      properties: 
        repo_path: 
          type: string
          description: Path to Git repository
        target:
          type: string
          description: Target branch or commit to compare with
      required: ["repo_path","target"]
  
  - name: git_commit
    description: 记录对存储库的更改
    inputSchema:
      type: object
      properties: 
        repo_path: 
          type: string
          description: Path to Git repository
        message:
          type: string
          description: Commit message
      required: ["repo_path","message"]
  
  - name: git_add
    description: 将文件内容添加到暂存区
    inputSchema:
      type: object
      properties: 
        repo_path: 
          type: string
          description: Path to Git repository
        files:
          type: array
          description: Array of file paths to stage
      required: ["repo_path","files"]
  
  - name: git_reset
    description: 取消所有已暂存的更改
    inputSchema:
      type: object
      properties: 
        repo_path: 
          type: string
          description: Path to Git repository
      required: ["repo_path"]
  
  - name: git_init
    description: 初始化一个 Git 仓库
    inputSchema:
      type: object
      properties: 
        repo_path: 
          type: string
          description: Path to Git repository
      required: ["repo_path"]
  
  - name: git_checkout
    description: 切换分支
    inputSchema:
      type: object
      properties: 
        repo_path: 
          type: string
          description: Path to Git repository
        branch_name:
          type: string
          description: Name of branch to checkout
      required: ["repo_path","branch_name"]
  
  - name: git_create_branch
    description: 创建一个新分支
    inputSchema:
      type: object
      properties: 
        repo_path: 
          type: string
          description: Path to Git repository
        branch_name:
          type: string
          description: Name of the new branch
        start_point:
          type: string
          description: Starting point for the new branch
      required: ["repo_path","branch_name","start_point"]
uvx:
  command: uvx
  args: ["mcp-server-git"]
  config: |
    {
      "mcpServers": {
        "Git-Mcp-Server": {
          "command": "uvx",
          "type": "stdio",
          "args": [
            "{{SYS_MCP_SERVER}}"
          ]
        }
      }
    }