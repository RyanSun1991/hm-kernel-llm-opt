name: hub-ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install deps
        run: |
          pip install -r tools/requirements.txt
          pip install -r tools/requirements-dev.txt
      - name: toolchain tests
        run: python -m pytest tools/tests/ -q
      - name: schema lint + path<->scope consistency
        run: python tools/lint.py
      - name: secret scan
        run: python tools/redact.py --check
      - name: dedup gate (engine A) — fail on unresolved conflict
        run: |
          shopt -s nullglob globstar
          for f in staging/*.jsonl staging/**/*.jsonl; do
            echo "dedup $f"; python tools/dedup.py "$f" --check
          done
          echo "dedup gate ok (no staged conflicts)"

  # NOTE: Until the hub is git subtree-split into its own repo, this workflow
  # file lives here as a scaffold. GitHub only triggers workflows from .github/
  # at the *repository root*. After the split, this file is at root and runs.
