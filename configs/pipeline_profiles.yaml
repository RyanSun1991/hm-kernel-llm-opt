profiles:
  generic_full:
    title: Generic Full Pipeline
    description: domain-agnostic staged pipeline for any kernel directory, subsystem, or file target with automatic routing and long-term memory updates
    entry_agent: kernel-pipeline-starter
    manager_agent: os-opt-manager
    specialist_hint: auto
    pipeline_card: .opencode/pipelines/generic_full.md
    objective_template: Analyze and optimize {target} using the full generic pipeline with automatic routing, plan approval, implementation, review, validation, and memory updates.
    bootstrap_docs:
      - .opencode/docs/memory_system.md
    skills:
      - .opencode/skills/research-discipline.md
      - .opencode/skills/optimization-funnel.md
      - .opencode/skills/implementation-guardrails.md
      - .opencode/skills/validation-flight-check.md
      - .opencode/skills/memory-accumulation.md
    validation_mode: build_review_profile
    research_first: true
    artifacts_expected:
      - flamegraph
      - hitrace
      - hiperf

  hyperhold_full:
    title: Hyperhold Full Pipeline
    description: full research -> ideation -> implementation -> review -> validation pipeline for hyperhold, swap, hpio, and iotab paths
    entry_agent: kernel-pipeline-starter
