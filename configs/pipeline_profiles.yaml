  sync_review:
    title: Synchronization Risk Review
    description: targeted correctness and performance review for locks, waiters, and refcount-sensitive changes
    entry_agent: kernel-pipeline-starter
    manager_agent: os-opt-manager
    specialist_hint: basic-mechanism-sync-opt
    pipeline_card: .opencode/pipelines/sync_review.md
    objective_template: Review the synchronization, ownership, and race implications around {target}.
    skills:
      - .opencode/skills/research-discipline.md
      - .opencode/skills/validation-flight-check.md
      - .opencode/skills/memory-accumulation.md
    validation_mode: review_only
    research_first: true
    artifacts_expected: []

  workqueue_full:
