    entry_agent: kernel-pipeline-starter
    manager_agent: os-opt-manager
    specialist_hint: memmgr-reclaim-research
    pipeline_card: .opencode/pipelines/memmgr_reclaim_full.md
    objective_template: Analyze and optimize reclaim behavior around {target} with deep design understanding and review-gated implementation.
