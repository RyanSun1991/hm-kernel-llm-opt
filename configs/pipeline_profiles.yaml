    specialist_hint: hyperhold-io-opt
    pipeline_card: .opencode/pipelines/hyperhold_full.md
    objective_template: Analyze and optimize {target} with full design understanding, ranked ideas, implementation, review, and validation.
    bootstrap_docs:
      - .opencode/docs/memmgr-reclaim_bootstrap.md
    skills:
      - .opencode/skills/research-discipline.md
      - .opencode/skills/optimization-funnel.md
      - .opencode/skills/implementation-guardrails.md
      - .opencode/skills/validation-flight-check.md
      - .opencode/skills/memory-accumulation.md
    validation_mode: build_review_profile
    research_first: true
    artifacts_expected:
      - flamegraph
      - hitrace
      - hiperf

  memmgr_reclaim_full:
