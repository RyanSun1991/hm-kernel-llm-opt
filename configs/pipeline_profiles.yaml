profiles:
  generic_full:
    title: Generic Full Pipeline
    description: domain-agnostic staged pipeline for any kernel directory, subsystem, or file target with automatic routing, instruction-count-first planning, and long-term memory updates
    entry_agent: os-opt-manager
    manager_agent: os-opt-manager
    plan_reviewer_agent: kernel-plan-reviewer
    code_reviewer_agent: kernel-code-reviewer
    tester_agent: kernel-tester-agent
    specialist_hint: auto
    pipeline_card: .opencode/pipelines/generic_full.md
    objective_template: Analyze and optimize {target} using the full generic pipeline with instruction-count reduction as the primary target, plus plan review, implementation, code review, validation, and memory updates.
    bootstrap_docs:
      - .opencode/docs/memory_system.md
    skills:
      - .opencode/skills/instruction-count-first.md
      - .opencode/skills/research-discipline.md
      - .opencode/skills/optimization-funnel.md
      - .opencode/skills/handoff-contract.md
      - .opencode/skills/implementation-guardrails.md
      - .opencode/skills/validation-flight-check.md
      - .opencode/skills/memory-accumulation.md
      - .opencode/skills/flash-device-operations.md
      - .opencode/skills/ab-test-comparison.md
    validation_mode: plan_review_code_review_tester
    research_first: true
    primary_goal: instruction_count
    handoff_contract: .opencode/skills/handoff-contract.md
    artifacts_expected:
      - flamegraph
      - hitrace
      - hiperf

