# LLM API (OpenAI-compatible). Point api_base at your own gateway; keep the
# token in the HMOPT_LLM_API_KEY env var rather than committing it here.

api_base: "${HMOPT_LLM_BASE_URL}"
api_key_env: HMOPT_LLM_API_KEY

# Recommended defaults (adjust per task)
models:
  coding_fast: "qwen3-coder-30b"
  reasoning_strong: "gpt-oss-120b"
  general: "glm-4.7"

embeddings:
  default: "qwen3-embedding-8b"

security:
  allow_external_proxy_models: false
